<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHIKKY - AI Assistant</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
background:
radial-gradient(circle at 50% 10%,#12364d 0,#06111c 35%,#02050a 80%);
color:#e9fbff;
font-family:Arial, sans-serif;
}

.app{
max-width:1000px;
margin:auto;
min-height:100vh;
padding:15px;
display:flex;
flex-direction:column;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
border:1px solid #17465c;
background:#06121ddd;
border-radius:20px;
}

.brand{
font-size:20px;
font-weight:bold;
letter-spacing:3px;
color:#4ceeff;
}

.status{
font-size:12px;
color:#70f7ff;
}

.hero{
text-align:center;
padding:25px 10px;
}

.orb{
width:160px;
height:160px;
margin:auto;
border-radius:50%;
background:
radial-gradient(circle,#ffffff 0,#55efff 15%,#08a8d0 35%,#07516c 50%,transparent 70%);
box-shadow:
0 0 30px #00eaff,
0 0 90px #00cfff55;
animation:pulse 3s infinite;
}

.orb.active{
animation:pulse .7s infinite;
}

@keyframes pulse{
50%{
transform:scale(1.06);
filter:brightness(1.3);
}
}

h1{
font-size:42px;
margin:20px 0 5px;
}

.sub{
color:#89aab7;
}

.panel{
border:1px solid #153b4e;
background:#040b13dd;
border-radius:22px;
padding:15px;
}

.chat{
height:420px;
overflow:auto;
}

.msg{
max-width:85%;
padding:13px;
margin:10px 0;
border-radius:16px;
line-height:1.5;
white-space:pre-wrap;
}

.bot{
background:#081620;
border:1px solid #153b4e;
}

.user{
margin-left:auto;
background:#07384d;
border:1px solid #12647e;
}

.quick{
display:flex;
gap:8px;
overflow:auto;
margin:10px 0;
}

.quick button{
white-space:nowrap;
background:#07151f;
color:#9df3fa;
border:1px solid #174456;
border-radius:20px;
padding:9px 13px;
}

.composer{
display:flex;
gap:8px;
}

input{
flex:1;
min-width:0;
background:#061019;
color:white;
border:1px solid #194459;
border-radius:15px;
padding:15px;
outline:none;
}

button{
cursor:pointer;
}

.send{
background:#082b3b;
color:#c9fbff;
border:1px solid #1c7891;
border-radius:15px;
padding:0 18px;
font-weight:bold;
}

.mic{
width:55px;
background:#082b3b;
color:white;
border:1px solid #1c7891;
border-radius:15px;
}

.footer{
text-align:center;
color:#55737e;
font-size:11px;
padding:12px;
}

@media(max-width:600px){
h1{font-size:30px}
.orb{width:135px;height:135px}
.chat{height:360px}
}
</style>
</head>

<body>

<div class="app">

<header class="top">
<div class="brand">CHIKKY // AI</div>
<div class="status" id="status">● ONLINE</div>
</header>

<section class="hero">

<div class="orb" id="orb"></div>

<h1>Good evening, Boss.</h1>

<p class="sub">
Your intelligent personal AI assistant is ready.
</p>

</section>

<section class="panel">

<div class="chat" id="chat">

<div class="msg bot">
CHIKKY online. I'm ready, Boss. Ask me anything.
</div>

</div>

<div class="quick">

<button onclick="ask('What can you do?')">
Capabilities
</button>

<button onclick="ask('Help me make a study plan')">
Study Plan
</button>

<button onclick="ask('Explain artificial intelligence simply')">
Explain AI
</button>

<button onclick="ask('Give me ideas to build an AI tool')">
AI Ideas
</button>

</div>

<form class="composer" onsubmit="send(event)">

<input
id="input"
autocomplete="off"
placeholder="Talk to CHIKKY..."
>

<button
class="mic"
type="button"
onclick="voice()">
🎙️
</button>

<button
class="send"
type="submit">
SEND
</button>

</form>

<div class="footer">
CHIKKY • AI CHAT • VOICE INPUT • VOICE REPLIES
</div>

</section>

</div>

<script>

const chat =
document.getElementById("chat");

const input =
document.getElementById("input");

const orb =
document.getElementById("orb");

const status =
document.getElementById("status");

let history=[];

function add(text,who){

const div=document.createElement("div");

div.className="msg "+who;

div.textContent=text;

chat.appendChild(div);

chat.scrollTop=chat.scrollHeight;

}

function ask(text){

input.value=text;

send();

}

async function send(e){

if(e)e.preventDefault();

const text=input.value.trim();

if(!text)return;

add(text,"user");

input.value="";

orb.classList.add("active");

status.textContent="● THINKING";

history.push({
role:"user",
content:text
});

try{

const response=await fetch("/api/chat",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
messages:history
})

});

const data=await response.json();

if(!response.ok){

throw new Error(
data.error || "AI connection failed"
);

}

const reply=data.reply;

history.push({
role:"assistant",
content:reply
});

add(reply,"bot");

speak(reply);

}

catch(error){

add(
"CHIKKY connection error: "+
error.message,
"bot"
);

}

finally{

orb.classList.remove("active");

status.textContent="● ONLINE";

}

}

function voice(){

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

add(
"Voice input is not supported in this browser.",
"bot"
);

return;

}

const recognition =
new SpeechRecognition();

recognition.lang="en-IN";

recognition.onstart=function(){

status.textContent="● LISTENING";

};

recognition.onresult=function(event){

input.value=
event.results[0][0].transcript;

send();

};

recognition.onend=function(){

status.textContent="● ONLINE";

};

recognition.start();

}

function speak(text){

if(!("speechSynthesis" in window))
return;

speechSynthesis.cancel();

const voice=
new SpeechSynthesisUtterance(text);

voice.rate=1;

voice.pitch=1;

speechSynthesis.speak(voice);

}

</script>

</body>
  </html>
